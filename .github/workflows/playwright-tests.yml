name: Playwright Java Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: true
        default: 'chrome'
        type: choice
        options:
        - chrome
        - firefox
        - webkit
        - all
      environment:
        description: 'Environment to test'
        required: true
        default: 'qa'
        type: choice
        options:
        - dev
        - qa
        - staging

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event.inputs.browser == 'all' && fromJson('["chrome", "firefox", "webkit"]') || fromJson(format('["{0}"]', github.event.inputs.browser || 'chrome')) }}
        java-version: [17]
    
    name: Test on ${{ matrix.browser }} with Java ${{ matrix.java-version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Install Playwright browsers
      run: |
        mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"
    
    - name: Run tests
      env:
        BROWSER: ${{ matrix.browser }}
        ENVIRONMENT: ${{ github.event.inputs.environment || 'qa' }}
      run: |
        mvn clean test \
          -Dbrowser=${{ matrix.browser }} \
          -Dheadless=true \
          -Denvironment=${{ env.ENVIRONMENT }}
    
    - name: Generate Allure Report
      if: always()
      run: mvn allure:report
    
    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ matrix.browser }}
        path: target/allure-results/
        retention-days: 30
    
    - name: Upload ChainTest Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: chaintest-reports-${{ matrix.browser }}
        path: target/chaintest/
        retention-days: 30
    
    - name: Upload Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ matrix.browser }}
        path: screenshot/
        retention-days: 7

  publish-reports:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Merge Allure Results
      run: |
        mkdir -p target/allure-results
        find . -name "allure-results-*" -type d -exec cp -r {}/* target/allure-results/ \;
    
    - name: Generate Combined Allure Report
      run: |
        mvn allure:report
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: target/site/allure-maven-plugin
        destination_dir: reports/${{ github.run_number }}
    
    - name: Comment PR with Report Links
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const reportUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_number }}/`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📊 Test Results
            
            🔗 **Allure Report**: [View Report](${reportUrl})
            
            **Test Summary:**
            - Run ID: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Browsers: Chrome, Firefox, WebKit
            
            Reports will be available for 30 days.`
          });

  docker-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t playwright-java-tests .
    
    - name: Run tests in Docker
      run: |
        docker run --rm \
          -v $(pwd)/target:/app/target \
          -e BROWSER=chrome \
          -e HEADLESS=true \
          playwright-java-tests
    
    - name: Upload Docker test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-test-results
        path: target/
        retention-days: 7 